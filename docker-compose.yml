services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mage2gen
      POSTGRES_USER: mage2gen
      POSTGRES_PASSWORD: mage2gen
    ports:
      - "5433:5432"
    volumes:
      - mage2gen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mage2gen -d mage2gen"]
      interval: 5s
      timeout: 5s
      retries: 10

  memcached:
    image: memcached:alpine
    ports:
      - "11211:11211"

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/usr/src/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_IS_DEBUG: "1"
      MYSQL_DB: mage2gen
      MYSQL_USERNAME: mage2gen
      MYSQL_PASSWORD: mage2gen
      MYSQL_HOST: db
      MYSQL_PORT: "5432"
      USE_SQLITE: "0"

volumes:
  mage2gen_pgdata:
